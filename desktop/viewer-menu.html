<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Live2DViewerEX 角色菜单</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    main { height: 100vh; padding: 6px; overflow: hidden; color: #322934; background: #fffafb; border: 1px solid #e7dce5; border-radius: 16px; font: 13px "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    button { display: block; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 6px; color: inherit; background: transparent; font: inherit; text-align: left; cursor: pointer; }
    button:hover { background: #f3eaf1; }
    button:focus-visible { outline: 2px solid #b46689; outline-offset: -2px; }
  </style>
</head>
<body>
  <main aria-label="Live2DViewerEX 角色菜单">
    <button data-action="open">打开面板</button>
    <button data-action="action">循环动作</button>
    <button data-action="voice">循环语音</button>
    <button data-action="costume">循环换装</button>
    <button data-action="reset">恢复待机</button>
    <button data-action="close">关闭菜单</button>
  </main>
  <script>
    function act(action) {
      window.viewerMenu.action(action).catch(() => {});
    }
    for (const button of document.querySelectorAll('[data-action]')) {
      button.addEventListener('click', () => act(button.dataset.action));
    }
    window.viewerMenu.state().then((state) => {
      if (!state?.viewerLinked) { act('close'); return; }
      for (const kind of ['action', 'voice', 'costume']) {
        const button = document.querySelector('[data-action="' + kind + '"]');
        const active = Boolean(state.looping[kind]);
        button.setAttribute('aria-pressed', String(active));
        if (active) button.textContent = '停止' + button.textContent;
      }
    }).catch(() => act('close'));
    addEventListener('keydown', (event) => { if (event.key === 'Escape') act('close'); });
  </script>
</body>
</html>
